# ---------------------------------------------------------------------------
# Path-based PR area labels
# ---------------------------------------------------------------------------
# Consumed by actions/labeler@v5 (see .github/workflows/labeler.yml).
# Each label lists the globs that, when touched by a PR, apply it. A PR that
# spans several areas gets several labels; nothing is ever removed here
# (sync-labels is off), so manually curated labels survive.
#
# Keep these globs in step with the tree in Architecture.md S2 --
# tests/unit/test_labeler_config.py fails if a glob stops matching real paths.
# ---------------------------------------------------------------------------

"area: cli":
  - changed-files:
      - any-glob-to-any-file:
          - "src/modeldock/cli/**"

"area: core":
  - changed-files:
      - any-glob-to-any-file:
          - "src/modeldock/core/**"
          - "src/modeldock/domain/**"
          - "src/modeldock/ports/**"
          - "src/modeldock/common/**"

"area: adapters":
  - changed-files:
      - any-glob-to-any-file:
          - "src/modeldock/adapters/**"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "example/**"
          - "**/*.md"
          - "mkdocs.yml"

"area: tests":
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "pyproject.toml"
          - "uv.lock"
          - ".pre-commit-config.yaml"
